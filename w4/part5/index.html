<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <script type="text/javascript" src="./utils.js"></script>
        <script type="text/javascript" src="./webgpu.js"></script>
        <style>
            .controls {
                margin-bottom: 10px;
                display: flex;
                flex-direction: column;
                gap: 5px;
                max-width: 400px;
                font-family: monospace;
            }
            .control-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            label {
                min-width: 150px;
            }
        </style>
    </head>
    <body>
        <div class="controls">
            <div class="control-row">
                <button id="increment">Increment Subdivision</button>
                <button id="decrement">Decrement Subdivision</button>
            </div>
            <div class="control-row">
                <label for="kd">Diffuse (kd):</label>
                <input type="range" id="kd" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="control-row">
                <label for="ks">Specular (ks):</label>
                <input type="range" id="ks" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="control-row">
                <label for="shininess">Shininess (s):</label>
                <input type="range" id="shininess" min="1" max="100" step="1" value="50">
            </div>
            <div class="control-row">
                <label for="le">Light Intensity (Le):</label>
                <input type="range" id="le" min="0" max="2" step="0.1" value="1.0">
            </div>
            <div class="control-row">
                <label for="la">Ambient Intensity (La):</label>
                <input type="range" id="la" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>
        <canvas id="canvas" width="800" height="600">
            Please use a browser that supports HTML5 canvas.
        </canvas>
    </body>
</html>
